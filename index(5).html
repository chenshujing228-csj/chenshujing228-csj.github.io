ent-annex-bar{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 11px;background:#f8fafc;border:1px solid var(--line);border-radius:9px;margin-bottom:8px}.current-annex-bar strong{color:#0f3b5c}.annex-bind-status{font-size:11px;color:var(--muted)}.annex-list-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.annex-empty{padding:18px 10px;text-align:center;color:var(--muted);font-size:12px}.formula-error{color:#b91c1c!important;background:#fef2f2!important;font-weight:700}.data-source-pill{display:inline-flex;align-items:center;gap:6px;background:#dcfce7;color:#166534;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700}.data-source-pill.baseline{background:#fef3c7;color:#92400e}.generate-summary{margin-top:10px;padding:9px 10px;border-radius:8px;background:#f8fafc;border:1px solid var(--line);font-size:11px;line-height:1.6}.annex-layout{grid-template-columns:270px minmax(0,1fr) 315px}.excel-workspace{min-height:520px}.sheet-grid th,.sheet-grid td{min-width:80px}.sheet-grid td:nth-child(2){min-width:180px}.annex-config-note{font-size:11px;color:#64748b;line-height:1.55;margin-top:8px}.bind-next{background:#0f4c75!important}.annex-required-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.annex-required-head .count{font-size:11px;color:#64748b}.annex-nav-buttons{display:flex;gap:6px;margin-top:8px}.annex-nav-buttons button{flex:1}.annex-done-note{color:#047857;font-weight:700}.annex-pending-note{color:#b45309;font-weight:700}.

<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><b>可研报告智能联动修改与附表生成平台</b><small>母版可研 × 投融资模型<br/>Word修改 × Excel框选附表 × 一致性审计</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-note">隐私提示：文件默认仅在当前浏览器本地解析和存储，不会自动上传第三方服务器。</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="project-select"><b>当前项目</b><select id="projectPicker"></select></div>
      <div class="top-actions"><button class="btn ghost" id="newProjectBtn">+ 新建项目</button><button class="btn primary" id="newVersionBtn">上传新版Excel</button></div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="modal-wrap" id="projectModal"><div class="modal">
  <h2>新建项目工作区</h2>
  <div class="form-grid">
    <div class="field"><label>项目名称 *</label><input id="pName" placeholder="如：锦州市公共灯杆智慧化改造提升项目"/></div>
    <div class="field"><label>项目类型</label><select id="pType"><option>智慧城市/新基建</option><option>分布式光伏</option><option>充电设施</option><option>停车场</option><option>产业园</option><option>文旅</option><option>市政基础设施</option><option>新能源</option><option>供热</option><option>污水处理</option><option>公共服务</option><option>其他</option></select></div>
    <div class="field"><label>建设地点</label><input id="pLocation" placeholder="省 / 市 / 区县"/></div>
    <div class="field"><label>备注</label><input id="pNote" placeholder="可选"/></div>
  </div>
  <div class="grid2" style="margin-top:14px">
    <div class="upload"><b>母版可研（优先 DOCX）</b><div class="hint">用于解析标题、正文、表格及数字命中位置。</div><input type="file" id="masterFile" accept=".docx"/></div>
    <div class="upload"><b>基准投融资 Excel</b><div class="hint">作为之后新版模型比较的基准版本。</div><input type="file" id="baselineFile" accept=".xlsx,.xls"/></div>
  </div>
  <div class="modal-actions"><button class="btn ghost" data-close="projectModal">取消</button><button class="btn primary" id="createProjectBtn">建立项目</button></div>
</div></div>
<div class="modal-wrap" id="versionModal"><div class="modal">
  <h2>上传新版投融资 Excel</h2><div class="hint">系统将与当前基准版本自动比较，并重新生成变化参数、章节影响、修改清单和一致性审计。</div>
  <div class="upload" style="margin-top:14px"><input type="file" id="newExcelFile" accept=".xlsx,.xls"/></div>
  <div class="modal-actions"><button class="btn ghost" data-close="versionModal">取消</button><button class="btn primary" id="analyzeVersionBtn">开始比对</button></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
// ---------- Storage ----------
const db = new Dexie('FeasibilitySyncDB');

async function toBuf(input){return input instanceof ArrayBuffer?input:(ArrayBuffer.isView(input)?input.buffer:await input.arrayBuffer())}
async function parseDocx(file){
  const zip=await JSZip.loadAsync(await toBuf(file));
  const xml=await zip.file('word/document.xml').async('string');
  const stylesXml=zip.file('word/styles.xml')?await zip.file('word/styles.xml').async('string'):'';
  const parser=new DOMParser(); const doc=parser.parseFromString(xml,'application/xml');
  const styleMap={}; if(stylesXml){const sd=parser.parseFromString(stylesXml,'application/xml'); [...sd.getElementsByTagNameNS('*','style')].forEach(st=>{const id=st.getAttribute('w:styleId')||st.getAttribute('styleId');const n=st.getElementsByTagNameNS('*','name')[0];if(id&&n)styleMap[id]=n.getAttribute('w:val')||n.getAttribute('val')||id})}
  const body=doc.getElementsByTagNameNS('*','body')[0]; const blocks=[]; let currentHeading='';
  [...body.children].forEach((el,idx)=>{
    if(el.localName==='p'){
      const text=[...el.getElementsByTagNameNS('*','t')].map(n=>n.textContent).join('').trim(); if(!text)return;
      const pPr=el.getElementsByTagNameNS('*','pPr')[0]; const ps=pPr?.getElementsByTagNameNS('*','pStyle')[0]; const sid=ps?.getAttribute('w:val')||ps?.getAttribute('val')||'';
      const styleName=(styleMap[sid]||sid||'').toLowerCase();
      const headingByStyle=/heading|标题|title/.test(styleName); const headingByText=/^(第[一二三四五六七八九十\d]+章|\d+(?:\.\d+){0,4}[\.、\s]|附表\s*\d+)/.test(text);
      const isHeading=headingByStyle||headingByText; if(isHeading)currentHeading=text;
      blocks.push({type:isHeading?'heading':'paragraph',text,heading:currentHeading,index:idx});
    } else if(el.localName==='tbl'){
      const rows=[...el.getElementsByTagNameNS('*','tr')].map(tr=>[...tr.getElementsByTagNameNS('*','tc')].map(tc=>[...tc.getElementsByTagNameNS('*','t')].map(n=>n.textContent).join('').trim()));
      const text=rows.map(r=>r.join(' | ')).join('\n');blocks.push({type:'table',text,rows,heading:currentHeading,index:idx});
    }
  });
  const headings=blocks.filter(b=>b.type==='heading').map(b=>b.text);
  return {name:file.name,blocks,headings,plainText:blocks.map(b=>b.text).join('\n')};
}

function analyzeImpacts(docx,changes){
 if(!docx)return [];
 const impacts=[]; const changed=changes.filter(c=>c.changed);
 changed.forEach(ch=>{
   const vars=numericVariants(ch.old.value,ch.old.display); let exact=[];
   docx.blocks.forEach(b=>{const clean=b.text.replace(/,/g,'');if(vars.some(v=>clean.includes(String(v).replace(/,/g,''))))exact.push(b)});

function annexStatus(docx,changes){
  if(!docx)return[];

    const affected=changes.filter(c=>c.changed).some(c=>
      numericVariants(c.old.value,c.old.display).some(v=>txt.replace(/,/g,'').includes(v.replace(/,/g,'')))
    );
    return {heading:h,status:affected?'需更新':'未直接命中',affected};

function auditView(){if(!state.version)return noVersion('一致性审计');const v=state.version;const changed=v.changes.filter(x=>x.changed), oldHits=[];changed.forEach(c=>{const vars=numericVariants(c.old.value,c.old.display);const cnt=state.project.docx.blocks.filter(b=>vars.some(x=>b.text.replace(/,/g,'').includes(x.replace(/,/g,'')))).length;if(cnt)oldHits.push({label:c.label,count:cnt,old:c.old.display})});const bad=v.parsed.errors.length+v.parsed.conflicts.length+oldHits.length;return `<div class="page-title"><div><h1>一致性审计</h1><p>这是更新前审计：用于确认母版旧数、模型冲突和公式异常。</p></div><span class="status ${bad?'s-amber':'s-green'}">${bad?'待处理':'可提交'}</span></div><div class="audit"><div class="audit-box"><h3>旧数据残留</h3><b class="${oldHits.length?'redtxt':'greentxt'}">${oldHits.length} 个参数仍在母版出现</b><div class="hint">${oldHits.slice(0,8).map(x=>`${esc(x.label)}（${esc(fmt(x.old))}）：${x.count}处`).join('<br/>')||'未发现'}</div></div><div class="audit-box"><h3>Excel公式异常</h3><b class="${v.parsed.errors.length?'ambertxt':'greentxt'}">${v.parsed.errors.length} 处</b><div class="hint">${v.parsed.errors.slice(0,8).map(x=>`${esc(x.sheet)}!${esc(x.cell)} ${esc(x.error)}`).join('<br/>')||'未发现'}</div></div><div class="audit-box"><h3>同参数多口径</h3><b class="${v.parsed.conflicts.length?'ambertxt':'greentxt'}">${v.parsed.conflicts.length} 项</b><div class="hint">${v.parsed.conflicts.slice(0,8).map(x=>esc(x.label)).join('<br/>')||'未发现'}</div></div></div><div class="card" style="margin-top:14px"><h3 style="margin-top:0">审计结论</h3><p style="line-height:1.8">${bad?'当前不建议直接形成最终可研。请先在“数据变化 / Excel解析 / 修改审阅”中处理口径冲突、公式异常和旧值命中，再生成最终修改稿。':'本轮未识别到重大数据冲突，可进入导出阶段。'}</p></div>`}

// ---------- Word & Annex production ----------
function xmlEsc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function a1col(n){let s='';for(n++;n>0;n=Math.floor((n-1)/26))s=String.fromCharCode(65+(n-1)%26)+s;return s}
function rangeText(a,b){if(!a||!b)return '';const r1=Math.min(a.r,b.r),r2=Math.max(a.r,b.r),c1=Math.min(a.c,b.c),c2=Math.max(a.c,b.c);return `${a1col(c1)}${r1+1}:${a1col(c2)}${r2+1}`}
function parseA1Range(t){try{return XLSX.utils.decode_range(String(t).trim())}catch{return null}}
async function getAnnexWorkbook(){
 const hasDirect=!!state.annex.directBuffer;
 const hasNew=!!state.version?.excelBuffer;
 const buf=hasDirect?state.annex.directBuffer:(hasNew?state.version.excelBuffer:state.project?.baselineBuffer);
 if(!buf)throw Error('请先在附表生成器中打开最新版Excel');
 const key=hasDirect?`direct:${state.annex.directName}:${state.annex.directSize}`:(hasNew?`version:${state.version.id||state.version.createdAt||state.version.name}`:`baseline:${state.project.id}`);
 const name=hasDirect?state.annex.directName:(hasNew?state.version.name:state.project.baselineName);
 if(state.annex.wb&&state.annex.sourceKey===key)return state.annex.wb;
 state.annex.wb=await readWorkbook(buf);state.annex.sourceKey=key;state.annex.sourceName=name;
 const activeTab=Number(state.annex.wb?.Workbook?.WBView?.[0]?.activeTab);
 const preferred=Number.isFinite(activeTab)?state.annex.wb.SheetNames[activeTab]:null;
 if(!state.annex.sheet||!state.annex.wb.SheetNames.includes(state.annex.sheet))state.annex.sheet=preferred||state.annex.wb.SheetNames[0];
 return state.annex.wb
} 
async function openAnnexExcelFile(file){
 if(!file)return;
 const buf=await file.arrayBuffer();
 // 先直接读取用户刚选择的原始文件，不走参数识别层、不走旧版本缓存
 const wb=await readWorkbook(buf);
 state.annex.directBuffer=buf;state.annex.directName=file.name;state.annex.directSize=file.size||buf.byteLength;
 state.annex.wb=wb;state.annex.sourceKey=`direct:${file.name}:${state.annex.directSize}`;state.annex.sourceName=file.name;
 const activeTab=Number(wb?.Workbook?.WBView?.[0]?.activeTab);
 state.annex.sheet=(Number.isFinite(activeTab)&&wb.SheetNames[activeTab])?wb.SheetNames[activeTab]:wb.SheetNames[0];
 state.annex.start=state.annex.end=null;state.annex.previewPage=0;
 render();toast(`已打开最新版Excel：${file.name}`)
}
function exactCellText(cell){
 if(!cell)return '';
 // 数据层硬规则：只读取Excel文件中已有的显示值/缓存值，不重算、不补0、不改数。
 if(cell.w!==undefined&&cell.w!==null)return String(cell.w);
 if(cell.v!==undefined&&cell.v!==null){
   if(cell.t==='b')return cell.v?'TRUE':'FALSE';
   if(cell.v instanceof Date)return cell.v.toISOString().slice(0,10);
   return String(cell.v);
 }
 return '';
}
function exactCellRaw(cell){return cell&&cell.v!==undefined&&cell.v!==null?cell.v:null}

function parseAnnexHeadingText(h){const m=String(h||'').trim().match(/^附表\s*(\d+)\s*[：:、\-]?\s*(.*)$/);if(!m)return null;return {no:`附表${m[1]}`,title:(m[2]||'项目附表').trim()||'项目附表'}}
function masterAnnexDefinitions(){const hs=state.project?.docx?.headings||[];const seen=new Set(),out=[];for(const h of hs){const x=parseAnnexHeadingText(h);if(!x)continue;const k=x.no+'|'+x.title;if(seen.has(k))continue;seen.add(k);out.push(x)}return out}
function defaultAnnexConfig(x={}){return {no:x.no||'附表',title:x.title||'项目附表',sheet:x.sheet||'',range:x.range||'',titleRows:x.titleRows??0,headerRows:x.headerRows??2,fixedCols:x.fixedCols??4,yearsPerPage:x.yearsPerPage??0,fontSize:x.fontSize??7,titleInTable:x.titleInTable!==false,changed:x.changed}}

async function generateFullWord(){const plans=selectedWordPlans();if(!plans.length){toast('请至少勾选一项修改');return}const buf=state.project.masterBuffer;if(!buf){toast('当前项目未保存母版原文件，请重新建立项目');return}const zip=await JSZip.loadAsync(buf);const path='word/document.xml',xml=await zip.file(path).async('string');const dom=new DOMParser().parseFromString(xml,'application/xml');const ps=[...dom.getElementsByTagNameNS('*','p')];let changed=0;for(const plan of plans){const candidates=[plan.old,String(plan.old).replace(/,/g,'')].filter(Boolean);for(const p of ps){const text=[...p.getElementsByTagNameNS('*','t')].map(n=>n.textContent).join('');if(text!==plan.context&&!plan.context.includes(text)&&!text.includes(plan.old))continue;for(const oldS of candidates){if(oldS&&text.includes(oldS)){if(replaceTextInParagraphNodes(p,oldS,plan.new)){changed++;break}}}}}const out=new XMLSerializer().serializeToString(dom);zip.file(path,out);const blob=await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});downloadBlob(`${safeName(state.project.name)}_完整更新版可研.docx`,blob);toast(`已写入 ${changed} 处直接数字修改`)}
async function generatePartialWord(){const plans=selectedWordPlans();if(!plans.length){toast('请至少勾选一项修改');return}let body=pXml(`${state.project.name}——数据联动修改稿（仅修改部分）`,16,'center',true);body+=pXml(`生成时间：${new Date().toLocaleString('zh-CN')}`,9,'center');let last='';for(const p of plans){if(p.heading!==last){body+=pXml(p.heading,14,'left',true);last=p.heading}body+=pXml(`【参数】${p.parameter}：${p.old} → ${p.new}`,10,'left',true);body+=pXml(`【原文】${p.context}`,9,'left');body+=pXml(`【修改建议】仅将对应旧值替换为 ${p.new}，其余政策、技术路线、商业模式及无关表述保持不变。`,9,'left')}await buildMinimalDocx(body,`${safeName(state.project.name)}_仅修改部分可研.docx`,false);toast('仅修改部分Word已生成')}

async function generateChangeListWord(){if(!state.version){toast('请先上传新版Excel');return}let body=pXml(`${state.project.name}——可研修改清单`,16,'center',true);body+=pXml(`生成时间：${new Date().toLocaleString('zh-CN')}`,9,'center');const groups=groupBy(state.version.impacts,x=>x.level);for(const level of ['A','B']){const arr=groups[level]||[];if(!arr.length)continue;body+=pXml(level==='A'?'A级：必须修改':'B级：联动复核',14,'left',true);for(const x of arr){body+=pXml(`${x.heading}｜${x.parameter}`,10,'left',true);body+=pXml(`原值：${fmt(x.old)}    新值：${fmt(x.new)}    原因：${x.reason}`,9,'left');body+=pXml(`上下文：${x.text}`,8,'left')}}await buildMinimalDocx(body,`${safeName(state.project.name)}_可研修改清单.docx`,false);toast('可研修改清单Word已生成')}
function exportCenterView(){return `<div class="page-title"><div><h1>导出中心</h1><p>数据、修改清单、Word正文与横向附表均可从这里输出。</p></div></div><div class="grid3"><div class="card"><h3>数据变化清单</h3><p class="hint">内部核对新版Excel变化。</p><button class="btn primary" id="exportChanges">导出CSV</button></div><div class="card"><h3>章节修改清单</h3><p class="hint">A级直接修改 + B级联动复核，可导出CSV或Word。</p><button class="btn primary" id="exportImpacts">导出CSV</button> <button class="btn ghost" id="exportImpactsWord">导出Word</button></div><div class="card"><h3>项目分析快照</h3><p class="hint">参数、来源、异常、章节命中留档。</p><button class="btn primary" id="exportJson">导出JSON</button></div><div class="card"><h3>仅修改部分Word</h3><p class="hint">按A级直接命中生成可复制修改稿。</p><button class="btn primary" id="exportPartialWord">生成Word</button></div><div class="card"><h3>完整更新版可研</h3><p class="hint">进入“完整可研Word”审阅后定点写入母版。</p><button class="btn secondary" id="goWord">打开Word审阅</button></div><div class="card"><h3>投融资附表Word</h3><p class="hint">直接打开最新版Excel，点Sheet框选原表，生成A4横向附表。</p><button class="btn secondary" id="goAnnex">打开附表生成器</button></div></div>`}
function noVersion(title){return `<div class="page-title"><div><h1>${title}</h1><p>请先上传新版Excel形成比较版本。</p></div></div><div class="card empty"><button class="btn primary" onclick="openModal('versionModal')">上传新版Excel</button></div>`}
function groupBy(arr,fn){return arr.reduce((o,x)=>((o[fn(x)]??=[]).push(x),o),{})}
function bindViewEvents(){
 const ps=$('#paramSearch'),cf=$('#catFilter');if(ps&&cf){const f=()=>{$$('#paramTable tbody tr').forEach(r=>{const q=ps.value.toLowerCase(),cat=cf.value;r.style.display=(r.innerText.toLowerCase().includes(q)&&(!cat||r.dataset.cat===cat))?'':'none'})};ps.oninput=f;cf.onchange=f}
 $$('#changeTabs .tab').forEach(b=>b.onclick=()=>{$$('#changeTabs .tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');const c=b.dataset.cat;$$('#changeTable tbody tr').forEach(r=>r.style.display=(c==='all'||(c==='changed'&&r.dataset.changed==='true')||r.dataset.cat===c)?'':'none')});
 const ec=$('#exportChanges');if(ec)ec.onclick=()=>exportChanges();const ei=$('#exportImpacts');if(ei)ei.onclick=()=>exportImpacts();const eiw=$('#exportImpactsWord');if(eiw)eiw.onclick=generateChangeListWord;const ej=$('#exportJson');if(ej)ej.onclick=()=>download(`${safeName(state.project.name)}_分析快照.json`,JSON.stringify({project:{name:state.project.name,type:state.project.type,location:state.project.location},version:state.version},null,2),'application/json;charset=utf-8');
 const ep=$('#exportPartialWord');if(ep)ep.onclick=()=>{state.page='word';render();setTimeout(()=>$('#partialWord')?.click(),50)};const gw=$('#goWord');if(gw)gw.onclick=()=>{state.page='word';render()};const ga=$('#goAnnex');if(ga)ga.onclick=()=>{state.page='annex';render()};
 if($('#excelGrid')){initAnnexUI();const ax=$('#annexExcelFile');if(ax)ax.onchange=async()=>{try{await openAnnexExcelFile(ax.files?.[0])}catch(e){toast('打开Excel失败：'+e.message)}};$('#applyManualRange').onclick=applyManualRange;const pa=$('#previewAnnex');if(pa)pa.onclick=renderAnnexPreview;$('#bindAnnex').onclick=bindCurrentAnnexSelection;$('#prevAnnex').onclick=()=>moveAnnex(-1);$('#nextAnnex').onclick=()=>moveAnnex(1);$('#detectAnnexList').onclick=refillAnnexTargetsFromMaster;$('#addAnnexTarget').onclick=addAnnexTarget;$('#saveAnnexTpl').onclick=saveAnnexTemplates;$('#restoreAnnexTpl').onclick=restoreAnnexTemplates;$('#generateAnnexWord').onclick=()=>generateAnnexDocx(false);['annexNo','annexTitle','titleRows','headerRows','fixedCols','yearsPerPage','annexFont','titleInTable'].forEach(id=>{const el=$('#'+id);if(el){el.oninput=renderAnnexPreview;el.onchange=renderAnnexPreview}});bindAnnexQueueButtons()}
 if($('#partialWord')){$('#partialWord').onclick=generatePartialWord;$('#fullWord').onclick=generateFullWord;$('#approveAll').onclick=()=>$$('.wordCheck').forEach(x=>x.checked=true);$('#approveNone').onclick=()=>$$('.wordCheck').forEach(x=>x.checked=false)}
}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}function safeName(s){return String(s).replace(/[\\/:*?"<>|]/g,'_')}
function exportChanges(){const rows=[['分类','参数','原值','新值','变化','原来源','新来源'],...state.version.changes.filter(x=>x.changed).map(c=>[c.category,c.label,c.old.display,c.new.display,c.delta,`${c.old.sheet}!${c.old.cell}`,`${c.new.sheet}!${c.new.cell}`])];download(`${safeName(state.project.name)}_数据变化清单.csv`,'\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv;charset=utf-8')}
function exportImpacts(){const rows=[['级别','章节','参数','原值','新值','原文/上下文','修改原因'],...state.version.impacts.map(i=>[i.level,i.heading,i.parameter,i.old,i.new,i.text,i.reason])];download(`${safeName(state.project.name)}_章节修改清单.csv`,'\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv;charset=utf-8')}
// ---------- Global events ----------
$('#newProjectBtn').onclick=()=>openModal('projectModal');$('#newVersionBtn').onclick=()=>state.project?openModal('versionModal'):openModal('projectModal');$('#createProjectBtn').onclick=createProject;$('#analyzeVersionBtn').onclick=analyzeNewVersion;$('#projectPicker').onchange=e=>loadProject(Number(e.target.value));$$('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));$$('.modal-wrap').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModal(m.id)}));
refreshProjects();

.card{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:17px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.kpi{background:white;border:1px solid var(--line);border-radius:11px;padding:13px}.kpi small{color:var(--muted);display:block}.kpi b{font-size:22px;display:block;margin-top:5px}.redtxt{color:var(--red)}.ambertxt{color:var(--amber)}.greentxt{color:var(--green)}

table{width:100%;border-collapse:collapse;font-size:12px}th,td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}th{background:#f8fafc;color:#334155;font-weight:700;position:sticky;top:68px;z-index:1}.num{text-align:right;font-variant-numeric:tabular-nums}.table-wrap{overflow:auto;max-height:620px;border:1px solid var(--line);border-radius:10px}.searchline{display:flex;gap:8px;margin-bottom:10px}.searchline input,.searchline select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}.searchline input{flex:1}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.tab{border:1px solid var(--line);background:#fff;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:12px}.tab.active{background:#e8f0f7;border-color:#9ab3c5;color:#14364f;font-weight:700}
.chapter{border:1px solid var(--line);border-radius:10px;margin:9px 0;overflow:hidden}.chapter-head{padding:11px 12px;background:#fafcff;display:flex;justify-content:space-between;gap:10px}.chapter-body{padding:11px 12px;font-size:12px}.impact-item{display:grid;grid-template-columns:80px 1fr 1fr;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}.impact-item:last-child{border-bottom:0}.quote{background:#f8fafc;border-left:3px solid #9fb4c5;padding:8px 10px;border-radius:6px;line-height:1.65}.diff-old{background:#fff1f2;text-decoration:line-through}.diff-new{background:#ecfdf5;color:#065f46;font-weight:700}
.audit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.audit-box{border:1px solid var(--line);border-radius:10px;padding:13px;background:#fff}.audit-box h3{margin:0 0 7px;font-size:14px}.empty{text-align:center;padding:50px 20px;color:var(--muted)}.muted{color:var(--muted)}.hidden{display:none!important}.modal-wrap{position:fixed;inset:0;background:rgba(2,12,22,.55);display:none;align-items:center;justify-content:center;z-index:100}.modal-wrap.show{display:flex}.modal{width:min(760px,94vw);max-height:90vh;overflow:auto;background:#fff;border-radius:14px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.25)}.modal h2{margin:0 0 15px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{font-size:12px;color:#475569;display:block;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px}.field textarea{min-height:80px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;right:20px;bottom:20px;background:#102f49;color:#fff;padding:11px 14px;border-radius:9px;box-shadow:var(--shadow);display:none;z-index:200;max-width:420px}.loading{display:inline-block;width:13px;height:13px;border:2px solid #cbd5e1;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><b>可研报告智能联动更新平台</b><small>母版可研 × 投融资模型<br/>数据联动 × 一致性审计</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-note">隐私提示：文件默认仅在当前浏览器本地解析和存储，不会自动上传第三方服务器。</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="project-select"><b>当前项目</b><select id="projectPicker"></select></div>
      <div class="top-actions"><button class="btn ghost" id="newProjectBtn">+ 新建项目</button><button class="btn primary" id="newVersionBtn">上传新版Excel</button></div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="modal-wrap" id="projectModal"><div class="modal">
  <h2>新建项目工作区</h2>
  <div class="form-grid">
    <div class="field"><label>项目名称 *</label><input id="pName" placeholder="如：锦州市公共灯杆智慧化改造提升项目"/></div>
    <div class="field"><label>项目类型</label><select id="pType"><option>智慧城市/新基建</option><option>分布式光伏</option><option>充电设施</option><option>停车场</option><option>产业园</option><option>文旅</option><option>市政基础设施</option><option>新能源</option><option>供热</option><option>污水处理</option><option>公共服务</option><option>其他</option></select></div>
    <div class="field"><label>建设地点</label><input id="pLocation" placeholder="省 / 市 / 区县"/></div>
    <div class="field"><label>备注</label><input id="pNote" placeholder="可选"/></div>
  </div>
  <div class="grid2" style="margin-top:14px">
    <div class="upload"><b>母版可研（优先 DOCX）</b><div class="hint">用于解析标题、正文、表格及数字命中位置。</div><input type="file" id="masterFile" accept=".docx"/></div>
    <div class="upload"><b>基准投融资 Excel</b><div class="hint">作为之后新版模型比较的基准版本。</div><input type="file" id="baselineFile" accept=".xlsx,.xls"/></div>
  </div>
  <div class="modal-actions"><button class="btn ghost" data-close="projectModal">取消</button><button class="btn primary" id="createProjectBtn">建立项目</button></div>
</div></div>
<div class="modal-wrap" id="versionModal"><div class="modal">
  <h2>上传新版投融资 Excel</h2><div class="hint">系统将与当前基准版本自动比较，并重新生成变化参数、章节影响、修改清单和一致性审计。</div>
  <div class="upload" style="margin-top:14px"><input type="file" id="newExcelFile" accept=".xlsx,.xls"/></div>
  <div class="modal-actions"><button class="btn ghost" data-close="versionModal">取消</button><button class="btn primary" id="analyzeVersionBtn">开始比对</button></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
// ---------- Storage ----------
const db = new Dexie('FeasibilitySyncDB');
db.version(1).stores({projects:'++id, name, updatedAt', versions:'++id, projectId, createdAt'});
const NAV=[['dashboard','项目工作台'],['files','文件与版本'],['excel','Excel解析'],['changes','数据变化'],['impact','章节联动'],['review','修改审阅'],['annex','附表更新'],['audit','一致性审计'],['export','导出中心'],['rules','项目规则库']];
let state={page:'dashboard',projects:[],project:null,version:null};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(v){if(v===null||v===undefined||v==='')return '—'; if(typeof v==='number'){if(Math.abs(v)>=1000)return v.toLocaleString('zh-CN',{maximumFractionDigits:2}); return Number(v.toFixed(4)).toString()} return String(v)}
function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
function download(name,content,type='text/plain;charset=utf-8'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
// ---------- DOCX parser ----------
async function parseDocx(file){
  const zip=await JSZip.loadAsync(await file.arrayBuffer());
  const xml=await zip.file('word/document.xml').async('string');
  const stylesXml=zip.file('word/styles.xml')?await zip.file('word/styles.xml').async('string'):'';
  const parser=new DOMParser(); const doc=parser.parseFromString(xml,'application/xml');
  const styleMap={}; if(stylesXml){const sd=parser.parseFromString(stylesXml,'application/xml'); [...sd.getElementsByTagNameNS('*','style')].forEach(st=>{const id=st.getAttribute('w:styleId')||st.getAttribute('styleId');const n=st.getElementsByTagNameNS('*','name')[0];if(id&&n)styleMap[id]=n.getAttribute('w:val')||n.getAttribute('val')||id})}
  const body=doc.getElementsByTagNameNS('*','body')[0]; const blocks=[]; let currentHeading='';
  [...body.children].forEach((el,idx)=>{
    if(el.localName==='p'){
      const text=[...el.getElementsByTagNameNS('*','t')].map(n=>n.textContent).join('').trim(); if(!text)return;
      const pPr=el.getElementsByTagNameNS('*','pPr')[0]; const ps=pPr?.getElementsByTagNameNS('*','pStyle')[0]; const sid=ps?.getAttribute('w:val')||ps?.getAttribute('val')||'';
      const styleName=(styleMap[sid]||sid||'').toLowerCase();
      const headingByStyle=/heading|标题|title/.test(styleName); const headingByText=/^(第[一二三四五六七八九十\d]+章|\d+(?:\.\d+){0,4}[\.、\s]|附表\s*\d+)/.test(text);
      const isHeading=headingByStyle||headingByText; if(isHeading)currentHeading=text;
      blocks.push({type:isHeading?'heading':'paragraph',text,heading:currentHeading,index:idx});
    } else if(el.localName==='tbl'){
      const rows=[...el.getElementsByTagNameNS('*','tr')].map(tr=>[...tr.getElementsByTagNameNS('*','tc')].map(tc=>[...tc.getElementsByTagNameNS('*','t')].map(n=>n.textContent).join('').trim()));
      const text=rows.map(r=>r.join(' | ')).join('\n');blocks.push({type:'table',text,rows,heading:currentHeading,index:idx});
    }
  });
  const headings=blocks.filter(b=>b.type==='heading').map(b=>b.text);
  return {name:file.name,blocks,headings,plainText:blocks.map(b=>b.text).join('\n')};
}
// ---------- XLSX parser ----------
function readWorkbook(file){return file.arrayBuffer().then(buf=>XLSX.read(buf,{type:'array',cellFormula:true,cellNF:true,cellDates:true}))}
function cellDisplay(cell){if(!cell)return null; if(cell.w!==undefined)return cell.w; if(cell.v instanceof Date)return cell.v.toISOString().slice(0,10); return cell.v}
const LABEL_MAP=[
 ['项目总投资','投资'],['总投资','投资'],['建设投资','投资'],['工程费用','投资'],['工程费','投资'],['设备购置费','投资'],['建筑工程费','投资'],['安装工程费','投资'],['工程建设其他费','投资'],['预备费','投资'],['建设期利息','投资'],['经营权费','投资'],['使用权费','投资'],['流动资金','投资'],
 ['资本金比例','融资'],['项目资本金','融资'],['资本金','融资'],['银行贷款','融资'],['贷款金额','融资'],['贷款比例','融资'],['贷款利率','融资'],['借款利率','融资'],['贷款期限','融资'],['偿还期限','融资'],['建设期','基本'],['运营期','基本'],['计算期','基本'],['合作期','基本'],['经营权期限','基本'],['使用权期限','基本'],
 ['营业收入','收入'],['运营收入','收入'],['年收入','收入'],['销售收入','收入'],['充电收入','收入'],['广告收入','收入'],['租赁收入','收入'],['租金收入','收入'],['上网收入','收入'],['自用收入','收入'],['绿电收入','收入'],['储能收入','收入'],
 ['经营成本','成本'],['总成本费用','成本'],['燃料及动力费','成本'],['人员工资','成本'],['工资福利','成本'],['维修费','成本'],['运维费','成本'],['管理费','成本'],['折旧','成本'],['摊销','成本'],['利息支出','成本'],['财务费用','成本'],
 ['增值税','税费'],['所得税','税费'],['税金及附加','税费'],['利润总额','财务'],['净利润','财务'],['内部收益率','财务'],['IRR','财务'],['财务净现值','财务'],['NPV','财务'],['投资回收期','财务'],['资本金财务内部收益率','财务'],['偿债备付率','财务'],['DSCR','财务'],['利息备付率','财务'],['本息覆盖倍数','财务'],['盈亏平衡点','财务'],['安全边际率','财务']
];
function normalizeLabel(s){return String(s||'').replace(/[\s：:（）()\[\]【】]/g,'').replace(/其中|合计|小计/g,'').toLowerCase()}
function guessCategory(label){const n=normalizeLabel(label); for(const [k,c] of LABEL_MAP){if(n.includes(normalizeLabel(k)))return c}return '其他'}
function isValueCell(c){return c&&(['n','d','b'].includes(c.t)||(!isNaN(Number(c.v))&&c.v!==''&&c.v!==null))}
function extractParameters(wb){
  const params=[]; const errors=[]; const sheets=[];
  wb.SheetNames.forEach(sn=>{
    const ws=wb.Sheets[sn]; const ref=ws['!ref']; if(!ref)return; const range=XLSX.utils.decode_range(ref); const preview=[];
    for(let r=range.s.r;r<=Math.min(range.e.r,range.s.r+120);r++){
      const row=[];for(let c=range.s.c;c<=Math.min(range.e.c,range.s.c+18);c++){const addr=XLSX.utils.encode_cell({r,c});row.push(cellDisplay(ws[addr]))}preview.push(row)
    }
    sheets.push({name:sn,ref,preview});
    for(let r=range.s.r;r<=range.e.r;r++)for(let c=range.s.c;c<=range.e.c;c++){
      const addr=XLSX.utils.encode_cell({r,c}), cell=ws[addr]; if(!cell)continue;
      const v=cellDisplay(cell); if(typeof v==='string'&&/^#(NAME\?|REF!|DIV\/0!|VALUE!|N\/A|NUM!|NULL!)/i.test(v))errors.push({sheet:sn,cell:addr,error:v});
      if(!isValueCell(cell))continue;
      const candidates=[];
      for(let dc=1;dc<=3;dc++){const lc=ws[XLSX.utils.encode_cell({r:r,c:c-dc})];if(lc&&typeof cellDisplay(lc)==='string')candidates.push({label:String(cellDisplay(lc)).trim(),dist:dc,dir:'left'})}
      for(let dr=1;dr<=2;dr++){const uc=ws[XLSX.utils.encode_cell({r:r-dr,c})];if(uc&&typeof cellDisplay(uc)==='string')candidates.push({label:String(cellDisplay(uc)).trim(),dist:dr+1,dir:'up'})}
      const cand=candidates.find(x=>x.label.length>=2&&x.label.length<=45&&!/^[-+\d,.%]+$/.test(x.label)); if(!cand)continue;
      const label=cand.label.replace(/^\d+[\.、]\s*/,'').trim(); const category=guessCategory(label);
      const raw=cell.v; const value=typeof raw==='number'?raw:(cell.t==='b'?Boolean(raw):raw); const display=cellDisplay(cell); const unitMatch=label.match(/（([^）]+)）|\(([^)]+)\)/); const unit=unitMatch?(unitMatch[1]||unitMatch[2]):((cell.z||'').includes('%')?'%':'');
      let confidence=category!=='其他'?'高':'中'; if(cand.dist>2)confidence='中';
      params.push({key:normalizeLabel(label),label,category,value,display,unit,sheet:sn,cell:addr,formula:cell.f||'',confidence});
    }
  });
  const dedup=new Map(); params.forEach(p=>{const k=p.key; if(!dedup.has(k)||scoreParam(p)>scoreParam(dedup.get(k)))dedup.set(k,p)});
  const conflicts=[]; const groups={};params.forEach(p=>(groups[p.key]??=[]).push(p));Object.entries(groups).forEach(([key,arr])=>{const vals=[...new Set(arr.map(x=>String(x.display)))];if(vals.length>1&&arr.some(x=>x.category!=='其他'))conflicts.push({key,label:arr[0].label,items:arr})});
  return {parameters:[...dedup.values()],allParameters:params,errors,conflicts,sheets};
}
function scoreParam(p){return (p.category!=='其他'?10:0)+(p.confidence==='高'?4:2)+(p.sheet.match(/指标|汇总|融资|投资|收入|成本|利润|现金流|还本/i)?3:0)-(p.formula?0:1)}
function comparable(v){if(typeof v==='number')return Math.round(v*1e8)/1e8;return String(v??'').trim()}
function compareParams(base,newer){
 const bm=new Map(base.parameters.map(p=>[p.key,p])); const nm=new Map(newer.parameters.map(p=>[p.key,p])); const keys=new Set([...bm.keys(),...nm.keys()]); const out=[];
 keys.forEach(k=>{const a=bm.get(k),b=nm.get(k); if(!a||!b)return; const av=comparable(a.value),bv=comparable(b.value); let changed=av!==bv; if(typeof av==='number'&&typeof bv==='number')changed=Math.abs(av-bv)>Math.max(1e-9,Math.abs(av)*1e-9); let delta='';if(typeof av==='number'&&typeof bv==='number')delta=bv-av;out.push({key:k,label:b.label||a.label,category:b.category||a.category,old:a,new:b,changed,delta})});
 return out.sort((x,y)=>(y.changed-x.changed)||x.category.localeCompare(y.category,'zh-CN'));
}
// ---------- Impact analysis ----------
const SEMANTIC_RULES={
 '投资':['总投资','投资规模','建设投资','工程费用','资金需求'], '融资':['资本金','银行贷款','贷款','融资','利率','偿债'], '收入':['营业收入','运营收入','收益','收费','结算','租金','广告','充电'], '成本':['经营成本','总成本','运维成本','维修','管理费','折旧','摊销'], '财务':['内部收益率','IRR','净现值','NPV','回收期','偿债','DSCR','盈利能力','清偿能力','财务可行','投资回报','安全边际'], '基本':['建设期','运营期','计算期','合作期','经营权','使用权'], '税费':['增值税','所得税','税金及附加']
};
function numericVariants(v,display){const out=new Set();if(typeof v==='number'){out.add(String(v));out.add(v.toFixed(2));out.add(v.toLocaleString('en-US',{maximumFractionDigits:2}));if(Math.abs(v)<1){out.add((v*100).toFixed(2)+'%');out.add((v*100).toFixed(0)+'%')}}if(display)out.add(String(display).replace(/,/g,''));return [...out].filter(x=>x&&x!=='0'&&x.length>1)}
function analyzeImpacts(docx,changes){
 if(!docx)return [];
 const impacts=[]; const changed=changes.filter(c=>c.changed);
 changed.forEach(ch=>{
   const vars=numericVariants(ch.old.value,ch.old.display); let exact=[];
   docx.blocks.forEach(b=>{const clean=b.text.replace(/,/g,'');if(vars.some(v=>clean.includes(String(v).replace(/,/g,''))))exact.push(b)});
   exact.slice(0,30).forEach(b=>impacts.push({level:'A',parameter:ch.label,category:ch.category,heading:b.heading||'未识别章节',old:ch.old.display,new:ch.new.display,text:b.text,reason:'母版正文直接命中旧值'}));
   const kws=SEMANTIC_RULES[ch.category]||[]; docx.blocks.forEach(b=>{if(b.type==='heading')return;if(kws.some(k=>b.text.includes(k))&&!exact.includes(b)){if(/结论|可行|能力|收益|投资|融资|收入|成本|期限/.test(b.text))impacts.push({level:'B',parameter:ch.label,category:ch.category,heading:b.heading||'未识别章节',old:ch.old.display,new:ch.new.display,text:b.text,reason:'参数变化可能影响该段结论/表述'})}})
 });
 const seen=new Set();return impacts.filter(x=>{const k=x.level+'|'+x.parameter+'|'+x.heading+'|'+x.text.slice(0,80);if(seen.has(k))return false;seen.add(k);return true}).slice(0,500)
}
function annexStatus(docx,changes){
  if(!docx)return[];
  const heads=docx.headings.filter(h=>/附表|投资估算表|收入.*税|总成本|折旧|利润|现金流|还本付息/.test(h));
  return heads.map(h=>{
    const txt=docx.blocks.filter(b=>b.heading===h).map(b=>b.text).join('\n');
    const affected=changes.filter(c=>c.changed).some(c=>
      numericVariants(c.old.value,c.old.display).some(v=>txt.replace(/,/g,'').includes(v.replace(/,/g,'')))
    );
    return {heading:h,status:affected?'需更新':'未直接命中',affected};
  });
}
// ---------- Project lifecycle ----------
async function refreshProjects(selectId){state.projects=await db.projects.orderBy('updatedAt').reverse().toArray();renderPicker(selectId);if(selectId)await loadProject(Number(selectId));else if(state.projects[0])await loadProject(state.projects[0].id);else{state.project=null;state.version=null;render()}}
function renderPicker(selectId){const p=$('#projectPicker');p.innerHTML=state.projects.length?state.projects.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join(''):'<option>暂无项目</option>';if(selectId)p.value=selectId;p.disabled=!state.projects.length}
async function loadProject(id){const p=await db.projects.get(id);if(!p)return;state.project=p;state.version=await db.versions.where('projectId').equals(id).reverse().sortBy('createdAt').then(a=>a[0]||null);$('#projectPicker').value=id;render()}
async function createProject(){
 const name=$('#pName').value.trim(),mf=$('#masterFile').files[0],bf=$('#baselineFile').files[0];if(!name||!mf||!bf){toast('请填写项目名称，并上传母版DOCX和基准Excel');return}
 const btn=$('#createProjectBtn');btn.disabled=true;btn.innerHTML='<span class="loading"></span> 正在解析…';
 try{const [docx,wb]=await Promise.all([parseDocx(mf),readWorkbook(bf)]);const base=extractParameters(wb);const now=Date.now();const id=await db.projects.add({name,type:$('#pType').value,location:$('#pLocation').value.trim(),note:$('#pNote').value.trim(),masterName:mf.name,baselineName:bf.name,docx,baseline:base,rules:[],locked:{},createdAt:now,updatedAt:now});closeModal('projectModal');await refreshProjects(id);toast('项目已建立，母版与基准模型解析完成')}
 catch(e){console.error(e);toast('解析失败：'+e.message)}finally{btn.disabled=false;btn.textContent='建立项目'}
}
async function analyzeNewVersion(){
 if(!state.project){toast('请先建立项目');return}const f=$('#newExcelFile').files[0];if(!f){toast('请选择新版Excel');return}const btn=$('#analyzeVersionBtn');btn.disabled=true;btn.innerHTML='<span class="loading"></span> 正在比对…';
 try{const wb=await readWorkbook(f);const parsed=extractParameters(wb);const changes=compareParams(state.project.baseline,parsed);const impacts=analyzeImpacts(state.project.docx,changes);const annex=annexStatus(state.project.docx,changes);const v={projectId:state.project.id,name:f.name,parsed,changes,impacts,annex,createdAt:Date.now()};const id=await db.versions.add(v);await db.projects.update(state.project.id,{updatedAt:Date.now()});state.version={...v,id};closeModal('versionModal');state.page='dashboard';render();toast('新版Excel比对完成')}
 catch(e){console.error(e);toast('比对失败：'+e.message)}finally{btn.disabled=false;btn.textContent='开始比对'}
}

function renderNav(){$('#nav').innerHTML=NAV.map(([k,n])=>`<button data-page="${k}" class="${state.page===k?'active':''}">${n}</button>`).join('');$$('#nav button').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render()})}
function welcomeView(){return `<div class="page-title"><div><h1>建立你的第一个可研工作区</h1><p>第一次上传母版DOCX和基准Excel；以后只需上传新版Excel。</p></div><button class="btn primary" onclick="openModal('projectModal')">+ 新建项目</button></div><div class="card empty"><b>通用型可研数据联动与一致性控制工具</b><p>系统不会把项目写死为光伏、智慧灯杆或某一行业。它会从母版章节和Excel结构中自动识别参数、变化和引用位置。</p></div>`}
function counts(){const v=state.version;if(!v)return{changed:0,chapters:0,annex:0,errors:state.project.baseline.errors.length,conflicts:state.project.baseline.conflicts.length,manual:0};const changed=v.changes.filter(x=>x.changed).length,chapters=new Set(v.impacts.map(x=>x.heading)).size,annex=v.annex.filter(x=>x.affected).length,errors=v.parsed.errors.length,conflicts=v.parsed.conflicts.length,manual=v.impacts.filter(x=>x.level==='B').length;return{changed,chapters,annex,errors,conflicts,manual}}
function dashboardView(){const n=counts(),v=state.version,p=state.project;return `<div class="page-title"><div><h1>${esc(p.name)}</h1><p>${esc(p.type||'')} ${p.location?'· '+esc(p.location):''} · 母版：${esc(p.masterName)}</p></div><span class="status s-blue">本地项目工作区</span></div>
<div class="kpis"><div class="kpi"><small>发生变化</small><b class="redtxt">${n.changed}</b></div><div class="kpi"><small>影响章节</small><b>${n.chapters}</b></div><div class="kpi"><small>影响附表</small><b>${n.annex}</b></div><div class="kpi"><small>公式异常</small><b class="ambertxt">${n.errors}</b></div><div class="kpi"><small>数据冲突</small><b class="ambertxt">${n.conflicts}</b></div><div class="kpi"><small>人工确认</small><b>${n.manual}</b></div></div>
<div class="grid2" style="margin-top:14px"><div class="card"><h3 style="margin-top:0">当前文件</h3>${fileLine('母版可研',p.masterName,'作为章节、正文与附表定位母版')}${fileLine('基准Excel',p.baselineName,'用于新旧参数比较')}${fileLine('本次Excel',v?.name||'尚未上传','上传后自动生成联动结果')}</div><div class="card"><h3 style="margin-top:0">本次更新结论</h3>${v?summaryText(v):'<div class="hint">尚未上传新版Excel。点击右上角“上传新版Excel”开始第一次比对。</div>'}</div></div>
${v?`<div class="card" style="margin-top:14px"><h3 style="margin-top:0">重大变化</h3>${topChangesTable(v.changes.filter(x=>x.changed).slice(0,12))}</div>`:''}`}
function fileLine(t,n,s){return `<div class="file-box"><div><b>${t}</b><small>${esc(s)}</small></div><div>${esc(n)}</div></div>`}
function summaryText(v){const cats=[...new Set(v.changes.filter(x=>x.changed).map(x=>x.category))];const ch=[...new Set(v.impacts.map(x=>x.heading))];return `<p style="line-height:1.8">本次模型共识别 <b>${v.parsed.parameters.length}</b> 个主要参数，其中 <b class="redtxt">${v.changes.filter(x=>x.changed).length}</b> 项发生变化，主要涉及 <b>${esc(cats.join('、')||'—')}</b>。母版中识别到 <b>${ch.length}</b> 个受影响章节/段落，建议先完成参数口径确认，再进入修改审阅。</p>${v.parsed.errors.length?`<div class="quote"><b class="ambertxt">注意：</b>新版Excel发现 ${v.parsed.errors.length} 处公式错误显示值，系统不会把错误值自动写入可研。</div>`:''}`}
function topChangesTable(arr){return `<table><thead><tr><th>分类</th><th>参数</th><th class="num">原值</th><th class="num">新值</th><th class="num">变化</th><th>来源</th></tr></thead><tbody>${arr.map(c=>`<tr><td>${esc(c.category)}</td><td><b>${esc(c.label)}</b></td><td class="num">${esc(fmt(c.old.display))}</td><td class="num"><b class="redtxt">${esc(fmt(c.new.display))}</b></td><td class="num">${typeof c.delta==='number'?esc(fmt(c.delta)):'—'}</td><td>${esc(c.new.sheet)}!${esc(c.new.cell)}</td></tr>`).join('')}</tbody></table>`}
function filesView(){const p=state.project,versions=[];return `<div class="page-title"><div><h1>文件与版本</h1><p>母版和基准文件在项目建立时固定；每次新版Excel形成一个分析版本。</p></div></div><div class="grid2"><div class="card"><h3 style="margin-top:0">母版与基准</h3>${fileLine('母版可研',p.masterName,`${p.docx.headings.length} 个标题 · ${p.docx.blocks.length} 个内容块`)}${fileLine('基准Excel',p.baselineName,`${p.baseline.sheets.length} 个Sheet · ${p.baseline.parameters.length} 个主参数`)}</div><div class="card"><h3 style="margin-top:0">当前分析版本</h3>${state.version?fileLine('新版Excel',state.version.name,new Date(state.version.createdAt).toLocaleString()):'<div class="empty">尚无新版模型</div>'}<button class="btn primary" style="margin-top:10px" onclick="openModal('versionModal')">上传新版Excel</button></div></div>`}
function excelView(){const src=state.version?.parsed||state.project.baseline;return `<div class="page-title"><div><h1>Excel解析</h1><p>展示自动识别参数、来源单元格、公式和异常。当前查看：${state.version?'新版模型':'基准模型'}</p></div></div><div class="grid2"><div class="card"><h3 style="margin-top:0">识别概况</h3><div class="grid3"><div><span class="muted">Sheet</span><h2>${src.sheets.length}</h2></div><div><span class="muted">主参数</span><h2>${src.parameters.length}</h2></div><div><span class="muted">公式错误</span><h2 class="ambertxt">${src.errors.length}</h2></div></div></div><div class="card"><h3 style="margin-top:0">异常</h3>${src.errors.length?src.errors.slice(0,10).map(e=>`<div class="quote">${esc(e.sheet)}!${esc(e.cell)}：<b class="redtxt">${esc(e.error)}</b></div>`).join(''):'<span class="status s-green">未识别到常见Excel错误值</span>'}</div></div><div class="card" style="margin-top:14px"><div class="searchline"><input id="paramSearch" placeholder="搜索参数 / Sheet / 单元格"/><select id="catFilter"><option value="">全部分类</option>${[...new Set(src.parameters.map(p=>p.category))].map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="table-wrap"><table id="paramTable"><thead><tr><th>分类</th><th>参数</th><th class="num">当前值</th><th>单位</th><th>Excel来源</th><th>公式</th><th>置信度</th></tr></thead><tbody>${paramRows(src.parameters)}</tbody></table></div></div>`}

function changesView(){if(!state.version)return noVersion('数据变化');const arr=state.version.changes;return `<div class="page-title"><div><h1>新旧数据变化</h1><p>基准Excel vs ${esc(state.version.name)}</p></div></div><div class="card"><div class="tabs" id="changeTabs"><button class="tab active" data-cat="all">全部</button><button class="tab" data-cat="changed">只看变化</button>${[...new Set(arr.map(x=>x.category))].map(c=>`<button class="tab" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="table-wrap"><table id="changeTable"><thead><tr><th>状态</th><th>分类</th><th>参数</th><th class="num">原值</th><th class="num">新值</th><th class="num">变化</th><th>新版来源</th></tr></thead><tbody>${arr.map(c=>`<tr data-cat="${esc(c.category)}" data-changed="${c.changed}"><td><span class="status ${c.changed?'s-red':'s-green'}">${c.changed?'变化':'一致'}</span></td><td>${esc(c.category)}</td><td><b>${esc(c.label)}</b></td><td class="num">${esc(fmt(c.old.display))}</td><td class="num">${esc(fmt(c.new.display))}</td><td class="num">${c.changed&&typeof c.delta==='number'?esc(fmt(c.delta)):'—'}</td><td>${esc(c.new.sheet)}!${esc(c.new.cell)}</td></tr>`).join('')}</tbody></table></div></div>`}
function impactView(){if(!state.version)return noVersion('章节联动');const groups=groupBy(state.version.impacts,x=>x.heading);return `<div class="page-title"><div><h1>章节影响地图</h1><p>红色=母版直接命中旧值；黄色=参数变化引发的语义联动复核。</p></div></div>${Object.keys(groups).length?Object.entries(groups).map(([h,items])=>`<div class="chapter"><div class="chapter-head"><b>${esc(h)}</b><span><span class="status s-red">A ${items.filter(x=>x.level==='A').length}</span> <span class="status s-amber">B ${items.filter(x=>x.level==='B').length}</span></span></div><div class="chapter-body">${items.slice(0,12).map(i=>`<div class="impact-item"><div><span class="status ${i.level==='A'?'s-red':'s-amber'}">${i.level==='A'?'必须修改':'联动复核'}</span></div><div><b>${esc(i.parameter)}</b><div class="muted">${esc(i.reason)}</div></div><div class="quote">${esc(i.text.slice(0,300))}</div></div>`).join('')}${items.length>12?`<div class="hint">该章节另有 ${items.length-12} 条命中，导出修改清单可查看完整记录。</div>`:''}</div></div>`).join(''):'<div class="card empty">尚未识别到母版正文中的直接/语义联动位置。建议在“项目规则库”人工补充映射。</div>'}`}

function annexView(){if(!state.version)return noVersion('附表更新');const a=state.version.annex;return `<div class="page-title"><div><h1>附表更新</h1><p>V2.0先做附表影响识别；后续版本支持Excel区域到Word附表整表重建。</p></div></div><div class="card">${a.length?`<table><thead><tr><th>附表/表名</th><th>状态</th><th>建议</th></tr></thead><tbody>${a.map(x=>`<tr><td><b>${esc(x.heading)}</b></td><td><span class="status ${x.affected?'s-red':'s-gray'}">${x.affected?'需更新':'未直接命中'}</span></td><td>${x.affected?'建议从新版Excel对应表重新生成，避免逐单元格替换。':'本轮未发现旧值直接命中，仍建议最终一致性检查。'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">母版未识别到附表标题。可在规则库中人工指定附表映射。</div>'}</div>`}
function auditView(){if(!state.version)return noVersion('一致性审计');const v=state.version;const changed=v.changes.filter(x=>x.changed), oldHits=[];changed.forEach(c=>{const vars=numericVariants(c.old.value,c.old.display);const cnt=state.project.docx.blocks.filter(b=>vars.some(x=>b.text.replace(/,/g,'').includes(x.replace(/,/g,'')))).length;if(cnt)oldHits.push({label:c.label,count:cnt,old:c.old.display})});const bad=v.parsed.errors.length+v.parsed.conflicts.length+oldHits.length;return `<div class="page-title"><div><h1>一致性审计</h1><p>这是更新前审计：用于确认母版旧数、模型冲突和公式异常。</p></div><span class="status ${bad?'s-amber':'s-green'}">${bad?'待处理':'可提交'}</span></div><div class="audit"><div class="audit-box"><h3>旧数据残留</h3><b class="${oldHits.length?'redtxt':'greentxt'}">${oldHits.length} 个参数仍在母版出现</b><div class="hint">${oldHits.slice(0,8).map(x=>`${esc(x.label)}（${esc(fmt(x.old))}）：${x.count}处`).join('<br/>')||'未发现'}</div></div><div class="audit-box"><h3>Excel公式异常</h3><b class="${v.parsed.errors.length?'ambertxt':'greentxt'}">${v.parsed.errors.length} 处</b><div class="hint">${v.parsed.errors.slice(0,8).map(x=>`${esc(x.sheet)}!${esc(x.cell)} ${esc(x.error)}`).join('<br/>')||'未发现'}</div></div><div class="audit-box"><h3>同参数多口径</h3><b class="${v.parsed.conflicts.length?'ambertxt':'greentxt'}">${v.parsed.conflicts.length} 项</b><div class="hint">${v.parsed.conflicts.slice(0,8).map(x=>esc(x.label)).join('<br/>')||'未发现'}</div></div></div><div class="card" style="margin-top:14px"><h3 style="margin-top:0">审计结论</h3><p style="line-height:1.8">${bad?'当前不建议直接形成最终可研。请先在“数据变化 / Excel解析 / 修改审阅”中处理口径冲突、公式异常和旧值命中，再生成最终修改稿。':'本轮未识别到重大数据冲突，可进入导出阶段。'}</p></div>`}
function exportView(){if(!state.version)return noVersion('导出中心');return `<div class="page-title"><div><h1>导出中心</h1><p>V2.0已支持数据变化、章节修改和项目分析JSON导出；完整Word自动改写作为V3接口预留。</p></div></div><div class="grid3"><div class="card"><h3>数据变化清单</h3><p class="hint">用于内部核对新版Excel发生了哪些变化。</p><button class="btn primary" id="exportChanges">导出CSV</button></div><div class="card"><h3>章节修改清单</h3><p class="hint">包含A级直接数字修改与B级联动复核。</p><button class="btn primary" id="exportImpacts">导出CSV</button></div><div class="card"><h3>项目分析快照</h3><p class="hint">保存参数、来源、变化、异常、章节命中，便于留档。</p><button class="btn primary" id="exportJson">导出JSON</button></div></div><div class="card" style="margin-top:14px"><h3 style="margin-top:0">Word输出接口</h3><p class="hint">V3将增加“生成仅修改部分Word”和“完整更新版可研”，并尽量继承母版标题、页眉页脚、表格和图片。V2.0先保证数据识别、变化定位和可追溯性准确。</p><button class="btn secondary" disabled>生成仅修改部分Word（V3）</button> <button class="btn secondary" disabled>生成完整更新版可研（V3）</button></div>`}
function rulesView(){const p=state.project;const rules=p.rules||[];return `<div class="page-title"><div><h1>项目规则库</h1><p>项目级联动关系会随项目保存。不同项目互不影响。</p></div></div><div class="grid2"><div class="card"><h3 style="margin-top:0">母版章节</h3><div class="table-wrap" style="max-height:520px"><table><tbody>${p.docx.headings.map(h=>`<tr><td>${esc(h)}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><h3 style="margin-top:0">已保存规则</h3>${rules.length?rules.map(r=>`<div class="quote"><b>${esc(r.parameter)}</b> → ${esc(r.chapter)}</div>`).join(''):'<div class="empty">V2.0自动学习接口已预留。当前规则主要由数字命中与语义联动生成。</div>'}<p class="hint">后续可增加：人工选择“参数 → 章节”，并点击“记住本项目联动关系”。</p></div></div>`}
function noVersion(title){return `<div class="page-title"><div><h1>${title}</h1><p>请先上传新版Excel形成比较版本。</p></div></div><div class="card empty"><button class="btn primary" onclick="openModal('versionModal')">上传新版Excel</button></div>`}
function groupBy(arr,fn){return arr.reduce((o,x)=>((o[fn(x)]??=[]).push(x),o),{})}
function bindViewEvents(){
 const ps=$('#paramSearch'),cf=$('#catFilter');if(ps&&cf){const f=()=>{$$('#paramTable tbody tr').forEach(r=>{const q=ps.value.toLowerCase(),cat=cf.value;r.style.display=(r.innerText.toLowerCase().includes(q)&&(!cat||r.dataset.cat===cat))?'':'none'})};ps.oninput=f;cf.onchange=f}
 $$('#changeTabs .tab').forEach(b=>b.onclick=()=>{$$('#changeTabs .tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');const c=b.dataset.cat;$$('#changeTable tbody tr').forEach(r=>r.style.display=(c==='all'||(c==='changed'&&r.dataset.changed==='true')||r.dataset.cat===c)?'':'none')});
 const ec=$('#exportChanges');if(ec)ec.onclick=()=>exportChanges();const ei=$('#exportImpacts');if(ei)ei.onclick=()=>exportImpacts();const ej=$('#exportJson');if(ej)ej.onclick=()=>download(`${safeName(state.project.name)}_分析快照.json`,JSON.stringify({project:{name:state.project.name,type:state.project.type,location:state.project.location},version:state.version},null,2),'application/json;charset=utf-8')
}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}function safeName(s){return String(s).replace(/[\\/:*?"<>|]/g,'_')}
function exportChanges(){const rows=[['分类','参数','原值','新值','变化','原来源','新来源'],...state.version.changes.filter(x=>x.changed).map(c=>[c.category,c.label,c.old.display,c.new.display,c.delta,`${c.old.sheet}!${c.old.cell}`,`${c.new.sheet}!${c.new.cell}`])];download(`${safeName(state.project.name)}_数据变化清单.csv`,'\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv;charset=utf-8')}
function exportImpacts(){const rows=[['级别','章节','参数','原值','新值','原文/上下文','修改原因'],...state.version.impacts.map(i=>[i.level,i.heading,i.parameter,i.old,i.new,i.text,i.reason])];download(`${safeName(state.project.name)}_章节修改清单.csv`,'\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv;charset=utf-8')}
// ---------- Global events ----------
$('#newProjectBtn').onclick=()=>openModal('projectModal');$('#newVersionBtn').onclick=()=>state.project?openModal('versionModal'):openModal('projectModal');$('#createProjectBtn').onclick=createProject;$('#analyzeVersionBtn').onclick=analyzeNewVersion;$('#projectPicker').onchange=e=>loadProject(Number(e.target.value));$$('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));$$('.modal-wrap').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModal(m.id)}));
refreshProjects();
</script>
</body>
